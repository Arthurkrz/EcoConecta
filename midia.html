<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#176b4c">
    <meta name="description" content="EcoConecta: portal educativo sobre hábitos sustentáveis.">
    <title>Mídia | EcoConecta</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/midia.css">
</head>

<body>
    <header id="site-header" class="site-header"></header>
    <main id="main-content">
        <section class="page-hero">
            <div class="container"><span class="eyebrow">EXPLORE O ECOCONECTA</span>
                <h1>Vídeo e áudio</h1>
                <p>Experimente as mídias para integração com a natureza.</p>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <div class="split">
                    <article class="media-box"><span class="tag">Vídeo</span>
                        <h2 class="h2-midia">Natureza em movimento</h2>
                        <p>Vídeo curto com a natureza em movimento.</p><video controls preload="metadata"
                            poster="img/horta.svg">
                            <source src="video/natureza.mp4" type="video/mp4">Seu navegador não suporta vídeo HTML5.
                        </video>
                    </article>
                    <article class="media-box"><span class="tag">Áudio</span>
                        <h2 class="h2-midia">Som ambiente</h2>
                        <p>Escute o som da natureza em movimento.
                        </p><audio controls preload="metadata">
                            <source src="audio/ambiente.wav" type="audio/wav">Seu navegador não suporta áudio HTML5.
                        </audio>
                    </article>
                </div>
            </div>
        </section>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
    <script type="module" src="js/app.js" defer></script>
</body>

</html>
