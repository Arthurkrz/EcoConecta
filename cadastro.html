<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#176b4c">
    <meta name="description" content="EcoConecta: portal educativo sobre hábitos sustentáveis.">
    <title>Cadastro | EcoConecta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/bootstrap-overrides.css">
</head>

<body>
    <header id="site-header" class="site-header"></header>
    <main id="main-content">
        <section class="page-hero">
            <div class="container">
                <span class="eyebrow">EXPLORE O ECOCONECTA</span>
                <h1>Participe da comunidade</h1>
                <p>Cadastre seu interesse em participar.</p>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <div class="split">
                    <div class="image-panel"><img src="img/bicicleta.svg"
                            alt="Bicicleta representando mobilidade sustentável"></div>
                    <form id="register-form" class="form-shell">
                        <h2>Crie seu cadastro</h2>
                        <p>Campos marcados são obrigatórios.</p>
                        <div class="field"><label for="register-name">Nome</label><input class="form-control"
                                id="register-name" name="name" type="text" required minlength="3"
                                pattern="[A-Za-zÀ-ÿ\s]{3,}" placeholder="Seu nome completo"></div>
                        <div class="field"><label for="register-email">E-mail</label><input class="form-control"
                                id="register-email" name="email" type="email" required placeholder="voce@exemplo.com">
                        </div>
                        <div class="field"><label for="register-city">Cidade</label><input class="form-control"
                                id="register-city" name="city" type="text" required minlength="2"
                                placeholder="Sua cidade"></div>
                        <div class="field"><label for="register-interest">Área de interesse</label><select
                                class="form-select" id="register-interest" name="interest" required>
                                <option value="">Selecione</option>
                                <option>Educação ambiental</option>
                                <option>Reciclagem</option>
                                <option>Mobilidade</option>
                                <option>Consumo consciente</option>
                            </select></div><button class="btn btn-success w-100" type="submit">Salvar cadastro</button>
                        <div id="form-feedback" class="hidden"></div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
    <script type="module" src="js/app.js" defer></script>
</body>

</html>
