<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="theme-color" content="#176b4c">
        <meta name="description" content="EcoConecta: portal educativo sobre hábitos sustentáveis.">
        <title>Projetos | EcoConecta</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="css/global.css">
        <link rel="stylesheet" href="css/components.css">
        <link rel="stylesheet" href="css/pages/projetos.css">
        <link rel="stylesheet" href="css/bootstrap-overrides.css">
        </head>
    <body>
        <header id="site-header" class="site-header"></header>
        <main id="main-content">
            <section class="page-hero">
                <div class="container"><span class="eyebrow">EXPLORE O ECOCONECTA</span>
                    <h1>Projetos que inspiram</h1>
                    <p>Iniciativas demonstrativas para conhecer, compartilhar e guardar em seu painel.</p>
                </div>
            </section>
            <section class="section">
                <div class="container">
                    <div class="filters" aria-label="Filtrar projetos"><button class="filter-btn project-filter selected"
                            data-filter="Todos" type="button" aria-pressed="true">Todos</button><button
                            class="filter-btn project-filter" data-filter="Educação" type="button">Educação</button><button
                            class="filter-btn project-filter" data-filter="Comunidade" type="button">Comunidade</button>
                    </div>
                    <div id="projects-list-page" class="cards"></div>
                </div>
            </section>
        </main>
        <footer id="site-footer" class="site-footer"></footer>
        <script type="module" src="js/app.js" defer></script>
    </body>
</html>
