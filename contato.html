<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#176b4c">
    <meta name="description" content="EcoConecta: portal educativo sobre hábitos sustentáveis.">
    <title>Contato | EcoConecta</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/contato.css">
    <link rel="stylesheet" href="css/bootstrap-overrides.css">
</head>

<body>
    <header id="site-header" class="site-header"></header>
    <main id="main-content">
        <section class="page-hero">
            <div class="container"><span class="eyebrow">EXPLORE O ECOCONECTA</span>
                <h1>Fale com a gente</h1>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <div class="split">
                    <div><span class="eyebrow">MENSAGENS</span>
                        <h2>Sua opinião é importante.</h2>
                        <p>Use o formulário para sugerir temas, enviar dúvidas ou ideias.</p>
                        <div class="callout">
                            <h3>📬 Contato demonstrativo</h3>
                            <p class="mb-0 page-contact-note">Veja as mensagens registradas em <a href="painel.html">Meu painel</a>.</p>
                        </div>
                    </div>
                    <form id="contact-form" class="form-shell" autocomplete="on">
                        <div class="field"><label for="contact-name">Nome completo</label><input id="contact-name"
                                name="name" type="text" placeholder="Digite seu nome" required minlength="3"
                                pattern="[A-Za-zÀ-ÿ\s]{3,}" title="Use pelo menos 3 letras"></div>
                        <div class="field"><label for="contact-email">E-mail</label><input id="contact-email"
                                name="email" type="email" placeholder="voce@exemplo.com" required></div>
                        <div class="field"><label for="contact-subject">Assunto</label><select name="subject"
                                id="contact-subject" required>
                                <option value="">Selecione um assunto</option>
                                <option>Dúvida</option>
                                <option>Sugestão</option>
                                <option>Projeto</option>
                                <option>Outro</option>
                            </select></div>
                        <div class="field"><label for="contact-message">Mensagem</label><textarea name="message"
                                id="contact-message" placeholder="Conte sua ideia (pelo menos 10 caracteres)" required
                                minlength="10"></textarea></div><button class="btn btn-success w-100"
                            type="submit">Enviar mensagem</button>
                        <div id="form-feedback" class="hidden"></div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer id="site-footer" class="site-footer"></footer>
    <script type="module" src="js/app.js" defer></script>
</body>

</html>
